<style>
/* ===== نظام الحضور والانصراف 3.6 — واجهة RTL بلا مكتبات خارجية ===== */
:root {
  --bg: #eef3f6;
  --surface: #ffffff;
  --surface-2: #f6f9fa;
  --ink: #132e3a;
  --ink-soft: #3d5c6b;
  --muted: #6d8492;
  --line: #d8e4ea;
  --line-strong: #c2d4dd;
  --brand: #0e6b63;
  --brand-dark: #0a4f49;
  --brand-soft: #e2f1ef;
  --accent: #b9822c;
  --accent-soft: #fbf1df;
  --danger: #b03a35;
  --danger-soft: #fbe9e8;
  --ok: #2e7d55;
  --ok-soft: #e5f4ec;
  --warn: #a0661c;
  --warn-soft: #fbf0dd;
  --info: #28688f;
  --info-soft: #e7f1f8;
  --shadow: 0 10px 30px rgba(16, 52, 66, .08);
  --shadow-sm: 0 2px 8px rgba(16, 52, 66, .06);
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Times New Roman", "Traditional Arabic", "Noto Naskh Arabic", serif;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.65;
}
h1, h2, h3, h4 { margin: 0 0 .4rem; line-height: 1.35; font-weight: 700; }
p { margin: 0 0 .6rem; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--brand); }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.mono { font-family: "Consolas", "Courier New", monospace; letter-spacing: .5px; }
.nowrap { white-space: nowrap; }
.spacer { flex: 1 1 auto; }
.danger-text { color: var(--danger); }
.ok-text { color: var(--ok); }
.small { font-size: .85rem; }
.center { text-align: center; }

/* ===== شاشة التحميل ===== */
.boot-screen {
  position: fixed; inset: 0; z-index: 60;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, #0c3b3b, #132e3a 60%, #1c242c);
}
.boot-card { color: #eaf4f2; text-align: center; }
.boot-card p { margin-top: .8rem; color: #b9d3d0; }

.brand-mark {
  width: 56px; height: 56px; margin: 0 auto .9rem;
  display: flex; align-items: center; justify-content: center;
  border-radius: 16px;
  background: linear-gradient(145deg, var(--brand), #0a4240);
  color: #fff; font-size: 1.6rem; font-weight: 700;
  box-shadow: 0 8px 20px rgba(0, 0, 0, .25);
}
.brand-mark.sm { width: 38px; height: 38px; margin: 0; border-radius: 11px; font-size: 1.1rem; }

/* ===== شاشة الدخول ===== */
.login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  background:
    radial-gradient(circle at 15% 10%, rgba(14, 107, 99, .18), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(185, 130, 44, .14), transparent 45%),
    linear-gradient(160deg, #0c3b3b, #132e3a 55%, #1b252d);
}
.login-panel {
  width: 100%; max-width: 440px;
  background: var(--surface);
  border-radius: 20px;
  padding: 30px 28px 24px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  border: 1px solid rgba(255, 255, 255, .5);
}
.login-brand { text-align: center; margin-bottom: 18px; }
.login-brand h1 { font-size: 1.35rem; }
.login-brand .muted { margin: 0; font-size: .9rem; }
.login-note {
  margin: 18px 0 0; padding-top: 14px;
  border-top: 1px solid var(--line);
  color: var(--muted); font-size: .78rem; line-height: 1.7;
}
.login-version { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: .72rem; }

.divider {
  display: flex; align-items: center; gap: 12px;
  margin: 16px 0; color: var(--muted); font-size: .78rem;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}

/* ===== الحقول والأزرار ===== */
.stack { display: grid; gap: 12px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .label {
  font-size: .86rem; font-weight: 600; color: var(--ink-soft);
}
input[type="text"], input[type="password"], input[type="search"], input[type="date"],
input[type="time"], input[type="number"], input[type="email"], select, textarea {
  width: 100%;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 3px rgba(14, 107, 99, .14);
}
input:disabled, select:disabled, textarea:disabled {
  background: var(--surface-2); color: var(--muted); cursor: not-allowed;
}
textarea { min-height: 90px; resize: vertical; }
.input-action { display: flex; gap: 8px; align-items: stretch; }
.input-action > input { flex: 1 1 auto; }
.input-action > button { flex: 0 0 auto; white-space: nowrap; }
/* حقل التقاط الباركود: ثابت عند أصل الشاشة حتى لا يقفز التمرير عند تركيزه. */
.scan-capture { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; margin: 0; }
.hint { color: var(--muted); font-size: .78rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 16px;
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-weight: 600;
  transition: background .15s, border-color .15s, transform .05s, box-shadow .15s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--brand); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #922e2a; border-color: #922e2a; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--brand-soft); }
.btn.danger-ghost { color: var(--danger); border-color: var(--danger-soft); background: #fff; }
.btn.danger-ghost:hover { background: var(--danger-soft); border-color: var(--danger); }
.btn.sm { padding: 5px 10px; font-size: .82rem; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.google { margin-top: 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ===== التطبيق ===== */
.app-shell { min-height: 100vh; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 16px;
  padding: 10px 22px;
  background: rgba(255, 255, 255, .96);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  backdrop-filter: blur(6px);
}
.topbar-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-titles { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; }
.topbar-titles strong { font-size: 1rem; }
.topbar-titles span { font-size: .78rem; }
.topbar-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; }

.user-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: .82rem; color: var(--ink-soft); white-space: nowrap;
}
.conn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  font-size: .76rem; font-weight: 600; border: 1px solid transparent;
}
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.conn.is-idle { color: var(--muted); background: var(--surface-2); border-color: var(--line); }
.conn.is-busy { color: var(--warn); background: var(--warn-soft); border-color: #ecd9b6; }
.conn.is-online { color: var(--ok); background: var(--ok-soft); border-color: #c8e6d6; }
.conn.is-offline { color: var(--danger); background: var(--danger-soft); border-color: #efc9c7; }
.conn.is-busy .conn-dot { animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

.main-nav {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 8px 22px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  scrollbar-width: thin;
}
.nav-tab {
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  padding: 8px 16px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 600;
  white-space: nowrap;
}
.nav-tab:hover { background: var(--surface-2); }
.nav-tab.active { background: var(--brand); color: #fff; }
.nav-tab.logout { color: var(--danger); margin-inline-start: auto; }
.nav-tab.logout:hover { background: var(--danger-soft); }

.main { width: 100%; max-width: 1240px; margin: 0 auto; padding: 22px 22px 60px; outline: none; }

.page-head {
  display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.page-head h2 { font-size: 1.3rem; margin: 0; }
.page-head .sub { color: var(--muted); font-size: .85rem; margin: 0; }
.page-head .spacer { flex: 1 1 auto; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head h3 { font-size: 1.02rem; margin: 0; }
.card-head .spacer { flex: 1 1 auto; }
.card-sub { color: var(--muted); font-size: .82rem; margin: -6px 0 12px; }

.grid { display: grid; gap: 14px; }
.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.col-span-2 { grid-column: span 2; }

.summary-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-bottom: 16px; }
.stat {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
}
.stat::after { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 4px; background: var(--line-strong); }
.stat.ok::after { background: var(--ok); }
.stat.bad::after { background: var(--danger); }
.stat.warn::after { background: var(--accent); }
.stat.info::after { background: var(--info); }
.stat-value { font-size: 1.65rem; font-weight: 700; line-height: 1.2; }
.stat-label { color: var(--muted); font-size: .8rem; margin-top: 2px; }

.alert {
  position: relative;
  padding: 10px 14px;
  padding-inline-end: 38px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  margin-bottom: 14px;
  font-size: .88rem;
}
.alert-close {
  position: absolute;
  inset-block-start: 4px;
  inset-inline-end: 6px;
  width: 26px; height: 26px;
  border: none; border-radius: 50%;
  background: transparent; color: inherit;
  font-size: 1.1rem; line-height: 1;
  cursor: pointer; opacity: .65;
}
.alert-close:hover, .alert-close:focus-visible { opacity: 1; background: rgba(0, 0, 0, .06); }
.alert.error { background: var(--danger-soft); border-color: #efc9c7; color: #7e2723; }
.alert.success { background: var(--ok-soft); border-color: #c8e6d6; color: #1f5f41; }
.alert.warn { background: var(--warn-soft); border-color: #ecd9b6; color: #7a5016; }
.alert.info { background: var(--info-soft); border-color: #c8dfef; color: #1f5373; }
.alert strong { display: block; margin-bottom: 2px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: 999px;
  font-size: .74rem; font-weight: 700; border: 1px solid transparent; white-space: nowrap;
}
.badge.present, .badge.active, .badge.success, .badge.confirmed { background: var(--ok-soft); color: #1f5f41; border-color: #c8e6d6; }
.badge.absent, .badge.revoked, .badge.fail, .badge.cancelled { background: var(--danger-soft); color: #7e2723; border-color: #efc9c7; }
.badge.pending, .badge.draft { background: var(--warn-soft); color: #7a5016; border-color: #ecd9b6; }
.badge.muted, .badge.inactive { background: var(--surface-2); color: var(--muted); border-color: var(--line); }
.badge.info { background: var(--info-soft); color: #1f5373; border-color: #c8dfef; }

.table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--line); }
table.data { width: 100%; border-collapse: collapse; font-size: .86rem; background: #fff; }
table.data th, table.data td { padding: 9px 12px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data thead th {
  background: var(--surface-2); color: var(--ink-soft);
  font-size: .78rem; font-weight: 700; position: sticky; top: 0; z-index: 1;
}
table.data tbody tr:hover { background: #fafcfd; }
table.data tbody tr:last-child td { border-bottom: none; }
table.data td.num, table.data th.num { text-align: center; }
.empty {
  padding: 26px 16px; text-align: center; color: var(--muted);
  background: var(--surface-2); border-radius: var(--radius-sm); border: 1px dashed var(--line-strong);
}
.empty strong { display: block; color: var(--ink-soft); margin-bottom: 4px; }

.segmented {
  display: inline-flex; padding: 4px; gap: 4px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px;
}
.segmented button {
  border: none; background: transparent; padding: 7px 18px; border-radius: 999px;
  cursor: pointer; font-weight: 600; color: var(--ink-soft);
}
.segmented button.active { background: var(--brand); color: #fff; box-shadow: var(--shadow-sm); }
.segmented button.active.out { background: var(--accent); }

.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.subnav button {
  border: 1px solid var(--line-strong); background: #fff; color: var(--ink-soft);
  padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .88rem;
}
.subnav button:hover { border-color: var(--brand); }
.subnav button.active { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark); }

.scan-hero {
  display: grid; gap: 12px;
  background: linear-gradient(150deg, #0d5751, #0e6b63 55%, #147a70);
  color: #eaf6f4; border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.scan-hero h3 { color: #fff; margin: 0; }
.scan-hero .hint { color: #c4e2dd; }
.scan-hero input { border-color: rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .96); color: var(--ink); }
.scan-hero .segmented { background: rgba(0, 0, 0, .18); border-color: rgba(255, 255, 255, .2); }
.scan-hero .segmented button { color: #d7ebe8; }
.scan-hero .segmented button.active { background: #fff; color: var(--brand-dark); }
.scan-hero .segmented button.active.out { background: #f3d9ae; color: #6b4714; }
.scan-hero .btn { border-color: rgba(255, 255, 255, .4); }
.scan-result { border-radius: var(--radius-sm); padding: 12px 14px; background: rgba(255, 255, 255, .14); border: 1px solid rgba(255, 255, 255, .25); }
.scan-result.ok { background: #e5f4ec; color: #1f5f41; border-color: #b9e0cb; }
.scan-result.bad { background: #fbe9e8; color: #7e2723; border-color: #efc9c7; }
.scan-result strong { font-size: 1rem; }

.checkbox-grid { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.check {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background: var(--surface-2); cursor: pointer; font-size: .86rem;
}
.check input { width: 16px; height: 16px; accent-color: var(--brand); }
.check:hover { border-color: var(--brand); }

.list-check { max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px; }
.list-check .check { border: none; background: transparent; border-radius: 6px; }
.list-check .check:hover { background: var(--surface-2); }

.search-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.search-row .field { flex: 1 1 200px; }

.loading-row { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 26px 4px; }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid var(--line-strong); border-top-color: var(--brand);
  animation: spin .8s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== النوافذ ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10, 30, 38, .55);
  display: flex; align-items: center; justify-content: center;
  padding: 18px;
  animation: fade .15s ease-out;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal-card {
  width: 100%; max-width: 560px; max-height: 90vh;
  background: #fff; border-radius: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, .4);
  display: flex; flex-direction: column; overflow: hidden;
  animation: rise .18s ease-out;
}
.modal-card.wide { max-width: 760px; }
.modal-card.narrow { max-width: 420px; }
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 1.05rem; }
.modal-head .btn { margin-inline-start: auto; }
.modal-body { padding: 18px 20px; overflow: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.modal-foot .spacer { flex: 1 1 auto; }

.qr-box { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px; }
.qr-box img { width: 240px; height: 240px; image-rendering: pixelated; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }

/* بطاقة مطبوعة 6×6 سم: الاسم في الأعلى، الصف، ثم الباركود. */
.print-card-host { display: none; }
.print-card {
  width: 6cm; height: 6cm; box-sizing: border-box; padding: 3mm 3mm 2mm;
  display: flex; flex-direction: column; align-items: center; gap: 1.5mm;
  background: #fff; color: #111; border: 1px solid var(--line); border-radius: 6px;
  margin: 0 auto;
}
.print-card-name {
  font-size: 13pt; font-weight: 700; text-align: center; line-height: 1.25;
  max-width: 100%; overflow-wrap: anywhere;
}
.print-card-sub { font-size: 10.5pt; text-align: center; color: #333; }
.print-card-qr { width: 3.3cm; height: 3.3cm; image-rendering: pixelated; margin-top: auto; }
.card-preview { margin: 2px auto 4px; box-shadow: 0 8px 20px rgba(0, 0, 0, .12); }
.qr-token {
  width: 100%; padding: 8px 10px; background: var(--surface-2); border: 1px dashed var(--line-strong);
  border-radius: 8px; font-family: Consolas, monospace; font-size: .78rem; word-break: break-all; text-align: center;
}
.guard-note { width: 100%; background: var(--warn-soft); color: #7a5016; border: 1px solid #ecd9b6; border-radius: 8px; padding: 8px 10px; font-size: .8rem; }

/* ملصقات باركود جماعية: 3 أعمدة × 5.8 سم، تُقصّ وتُلصق. */
.print-barcodes-host { display: none; }
.barcode-sheet {
  display: grid; grid-template-columns: repeat(3, 5.8cm); gap: 2mm;
  justify-content: center; align-content: start; padding: 5mm; background: #fff;
}
.barcode-label {
  width: 5.8cm; height: 3cm; box-sizing: border-box; padding: 1mm;
  border: 1px dashed #c9d3d6; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0;
  background: #fff; color: #111; page-break-inside: avoid; break-inside: avoid;
}
.barcode-label-name { font-size: 8pt; font-weight: 700; text-align: center; line-height: 1.15; max-width: 100%; overflow-wrap: anywhere; }
.barcode-label-sub { font-size: 7.5pt; color: #333; line-height: 1.1; }
.barcode-label-qr { width: 1.8cm; height: 1.8cm; flex: 0 0 auto; fill: #000; }
.barcode-label-code { font-family: Consolas, monospace; font-size: 8pt; line-height: 1.2; letter-spacing: .06em; direction: ltr; }

.toasts { position: fixed; inset-inline-start: 18px; bottom: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; max-width: min(380px, calc(100vw - 36px)); }
.toast {
  padding: 11px 14px; border-radius: 10px; background: #1f3d49; color: #fff;
  box-shadow: 0 14px 30px rgba(0, 0, 0, .28); font-size: .86rem;
  animation: toastIn .2s ease-out; display: flex; gap: 8px; align-items: flex-start;
